<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="MLBB Tracker — Mobile Legends hero meta, esports standings and your own match history, powered by live data.">
  <meta name="theme-color" content="#111318">
  <meta name="color-scheme" content="dark light">

  <!-- Open Graph / social -->
  <meta property="og:title" content="MLBB Tracker">
  <meta property="og:description" content="Hero meta, esports standings and your own match history for Mobile Legends: Bang Bang.">
  <meta property="og:type" content="website">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MLBB Tracker">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MLBB Tracker — Hero Meta, Esports & Match History</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #111318;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: #111318;
      color: #F5F5F7;
      transition: opacity .3s ease;
    }
    #boot .mark {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: .14em;
      color: #8B7CFF;
    }
    #boot .sub {
      font-size: 13px;
      color: #747B8B;
    }
    #boot .bar {
      width: 140px;
      height: 3px;
      border-radius: 999px;
      background: #262B38;
      overflow: hidden;
    }
    #boot .bar span {
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 999px;
      background: #8B7CFF;
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }
  </style>
</head>
<body>
  <div id="boot">
    <div class="mark">MLBB TRACKER</div>
    <div class="bar"><span></span></div>
    <div class="sub">Loading live data…</div>
  </div>

  <script>
    // Hide the boot splash once Flutter has painted its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot');
      if (!boot) return;
      boot.style.opacity = '0';
      setTimeout(function () { boot.remove(); }, 320);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
